name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / ${{ matrix.dependencies }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        dependencies: [lowest, highest]
        exclude:
          - php: '8.2'
            laravel: '13.*'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, mbstring, dom, xml, xmlwriter, pdo_sqlite
          tools: composer:v2
          coverage: none
      - run: composer validate --strict
      - name: Select dependencies
        run: composer require --dev --no-update 'laravel/framework:${{ matrix.laravel }}' 'orchestra/testbench:${{ matrix.laravel == '12.*' && '^10.0' || '^11.0' }}'
      - name: Install dependencies
        run: composer update --prefer-dist --prefer-stable --no-interaction --no-progress
        env:
          COMPOSER_PREFER_LOWEST: ${{ matrix.dependencies == 'lowest' && '1' || '0' }}
      - run: composer analyse
      - run: composer test
      - run: vendor/bin/pint --test
        if: matrix.php == '8.3' && matrix.laravel == '12.*' && matrix.dependencies == 'highest'
